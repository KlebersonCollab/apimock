<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockForge API Studio — Instant Mock APIs & Prototyping</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235e6ad2'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="brand-container" onclick="app.navigate('dashboard')">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-title">
        MockForge <span class="brand-badge">Studio</span>
      </div>
    </div>

    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="dashboard" onclick="app.navigate('dashboard')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="nav-tab" data-view="endpoints" onclick="app.navigate('endpoints')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Endpoints <span class="tab-badge" id="badge-endpoint-count">0</span>
      </button>
      <button class="nav-tab" data-view="collections" onclick="app.navigate('collections')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Collections <span class="tab-badge" id="badge-collection-count">0</span>
      </button>
      <button class="nav-tab" data-view="traffic" onclick="app.navigate('traffic')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Live Traffic
      </button>
      <button class="nav-tab" data-view="auth" onclick="app.navigate('auth')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Auth Studio
      </button>
      <button class="nav-tab" data-view="openapi" onclick="app.navigate('openapi')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        OpenAPI & Hub
      </button>
      <button class="nav-tab" data-view="tester" onclick="app.navigate('tester')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Test Console
      </button>
    </nav>

    <div class="header-actions">
      <div class="live-indicator">
        <span class="pulse-dot"></span>
        <span id="sse-status">Live Connected</span>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="app.resetDemoData()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Demo Seeds
      </button>
      <button class="btn btn-primary btn-sm" onclick="views.endpoints.openEditor()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Mock
      </button>
    </div>
  </header>

  <!-- Main View Slot -->
  <main class="main-container" id="main-content">
    <!-- Rendered dynamically by views -->
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Reusable Modal Backdrop -->
  <div class="modal-backdrop" id="modal-container">
    <div class="modal-dialog" id="modal-dialog-content">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Application Modular Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/endpoints.js"></script>
  <script src="/js/views/collections.js"></script>
  <script src="/js/views/traffic.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/openapi.js"></script>
  <script src="/js/views/tester.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
